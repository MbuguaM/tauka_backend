{#
  Shared brand primitives for Tauka email.

  Everything here is table-based with inline styles. Email clients are not
  browsers: Outlook's Word renderer ignores padding on inline-block, Gmail
  strips <style> for messages forwarded to non-Gmail accounts, and neither
  supports flex, grid, or custom properties. So the design tokens from
  tauka-react-web's index.css are hard-coded as literals here rather than
  referenced as var(--ochre) — this file is the single place they are written
  down, and the sole place to change them.

    ink #1A1610   paper #FFFBF0   ochre #B86914   rust #EF6C00
    ochre-deep #8E5008   gold-leaf #C8A24C   moss #4F6B3D
    surface-container #F5EBD3   sand/outline-variant #CFC6AC   muted #7B7464
#}

{% set FONT_DISPLAY = "'Cormorant Garamond','EB Garamond',Georgia,'Times New Roman',serif" %}
{% set FONT_BODY = "'Plus Jakarta Sans','Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" %}


{#  Primary call to action. `variant`:
      ink   — dark on paper, the site's .btn-primary (default)
      amber — ochre on ink, the site's .btn-amber, for warmer/gift moments
    The nested table is what makes the background and radius survive Outlook. #}
{% macro button(href, label, variant='ink') %}
{% set bg = '#B86914' if variant == 'amber' else '#1A1610' %}
{% set fg = '#1A1610' if variant == 'amber' else '#FFFBF0' %}
<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:separate;mso-table-lspace:0;mso-table-rspace:0;">
  <tr>
    <td align="center" bgcolor="{{ bg }}" style="border-radius:4px;">
      <a href="{{ href }}" style="display:inline-block;padding:14px 26px;font-family:{{ FONT_BODY }};font-size:14px;font-weight:600;line-height:1;color:{{ fg }};text-decoration:none;border-radius:4px;">{{ label }}&nbsp;&nbsp;&rarr;</a>
    </td>
  </tr>
</table>
{% endmacro %}


{#  Secondary link, for the low-commitment option beside a button. #}
{% macro quiet_link(href, label) %}
<a href="{{ href }}" style="font-family:{{ FONT_BODY }};font-size:13px;color:#7B7464;text-decoration:underline;">{{ label }}</a>
{% endmacro %}


{#  Italic serif eyebrow with the site's ◇ marker. Sits above a heading. #}
{% macro eyebrow(text) %}
<p style="margin:0 0 10px;font-family:{{ FONT_DISPLAY }};font-style:italic;font-size:15px;color:#8E5008;">
  <span style="color:#EF6C00;">&#9671;</span>&nbsp; {{ text }}
</p>
{% endmacro %}


{#  Section heading. The brand's headings are italic Cormorant at a tight
    leading — that italic serif is the most recognisable part of the identity,
    so it is worth carrying even where the webfont will not load. #}
{% macro heading(text, size=30) %}
<h2 style="margin:0 0 14px;font-family:{{ FONT_DISPLAY }};font-style:italic;font-weight:500;font-size:{{ size }}px;line-height:1.08;letter-spacing:-0.005em;color:#1A1610;">{{ text }}</h2>
{% endmacro %}


{#  Bordered panel on the warm container tint — the site's .lang-card. #}
{% macro panel() %}
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin:24px 0;border-collapse:separate;">
  <tr>
    <td bgcolor="#F5EBD3" style="padding:24px;border:1px solid #CFC6AC;border-radius:10px;font-family:{{ FONT_BODY }};font-size:15px;line-height:1.6;color:#3A322B;">
      {{ caller() }}
    </td>
  </tr>
</table>
{% endmacro %}


{#  One figure in a stat row. Big italic ochre numeral, per .stats .num. #}
{% macro stat(value, label, color='#B86914') %}
<td width="50%" align="center" style="padding:14px 10px;">
  <div style="font-family:{{ FONT_DISPLAY }};font-style:italic;font-size:42px;line-height:1;color:{{ color }};">{{ value }}</div>
  <div style="font-family:{{ FONT_BODY }};font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:#7B7464;padding-top:6px;">{{ label }}</div>
</td>
{% endmacro %}


{#  Diamond rule. Stands in for the site's .telet band, whose diagonal
    repeating-linear-gradient no client would render. #}
{% macro divider() %}
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <td align="center" style="padding:26px 0;font-size:11px;letter-spacing:10px;line-height:1;color:#CFC6AC;">&#9671;&#9671;&#9671;</td>
  </tr>
</table>
{% endmacro %}


{#  Body paragraph. #}
{% macro p(text) %}
<p style="margin:0 0 14px;font-family:{{ FONT_BODY }};font-size:15px;line-height:1.65;color:#3A322B;">{{ text }}</p>
{% endmacro %}


{#  One footer link. #}
{% macro _fl(web, path, label) %}
<a href="{{ web }}{{ path }}" style="color:rgba(245,235,211,0.72);text-decoration:none;">{{ label }}</a><br>
{% endmacro %}

{#  Footer navigation, chosen by who is reading.

    The three audiences are not cosmetic — they differ in what the reader can
    actually reach. Supporters and prospects frequently have NO Tauka account
    (a gift supporter is created from test_supporters, a referral target has
    never signed up), so linking them to /account sends them to a login wall
    for a page that will never be theirs. Only `student` gets account links. #}
{% macro footer_nav(audience='prospect', web='') %}
{% set groups = {
  'student':   [('Your account', [('/account','Your account'), ('/account/subscription','Subscription'), ('/account/supporters','Your supporters'), ('/downloads','Download the app')]),
                ('Tauka',        [('/curriculum','Curriculum'), ('/contact','Contact'), ('/policy','Privacy'), ('/tos','Terms')])],
  'supporter': [('Tauka',        [('/features','What we teach'), ('/curriculum','Curriculum'), ('/gift/checkout','Gift a subscription')]),
                ('Help',         [('/contact','Contact'), ('/policy','Privacy'), ('/tos','Terms')])],
  'prospect':  [('Learn',        [('/features','Features'), ('/curriculum','Curriculum'), ('/pricing','Pricing'), ('/downloads','Download the app')]),
                ('Tauka',        [('/teach','Become a tutor'), ('/contact','Contact'), ('/policy','Privacy'), ('/tos','Terms')])]
} %}
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    {% for group_label, links in groups.get(audience, groups['prospect']) %}
    <td class="t-stack" width="50%" valign="top" style="padding-bottom:16px;">
      <div style="font-family:{{ FONT_DISPLAY }};font-style:italic;font-size:15px;color:#B86914;padding-bottom:10px;">{{ group_label }}</div>
      <div style="font-family:{{ FONT_BODY }};font-size:13px;line-height:2;">
        {% for path, label in links %}{{ _fl(web, path, label) }}{% endfor %}
      </div>
    </td>
    {% endfor %}
  </tr>
</table>
{% endmacro %}
