[project]
name = "tauka-py-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # apscheduler removed 2026-08-08: in-process scheduling cannot run on a
    # serverless host and double-fires on any multi-instance one. Daily jobs are
    # triggered externally via GET /tasks/daily.
    "cryptography>=46.0.6",
    "fastapi[standard]>=0.135.2",
    "jinja2>=3.1.6",
    "pillow>=12.2.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "resend>=2.30.1",
    "stripe>=15.1.0",
    "supabase>=2.28.3",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
